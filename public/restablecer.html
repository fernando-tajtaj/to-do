<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva contraseña - QA Proyectos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth">
      <div class="auth-caja">
        <div class="auth-marca"><span class="logo">QA</span><span>QA Proyectos</span></div>
        <div class="card">
          <div class="card-body">
            <h1>Nueva contraseña</h1>
            <p class="text-secondary-ui mb-4">Mínimo 8 caracteres, una mayúscula y un número.</p>
            <form id="restablecerForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="passwordNueva">Nueva contraseña</label>
                <input type="password" class="form-control" id="passwordNueva" autocomplete="new-password" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="passwordConfirmar">Confirmar contraseña</label>
                <input type="password" class="form-control" id="passwordConfirmar" autocomplete="new-password" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
            </form>
            <p class="text-center mt-4 mb-0"><a href="/index.html">Volver a iniciar sesión</a></p>
            <div id="mensajeAlerta" class="mensaje-formulario" role="status"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/restablecer.js"></script>
  </body>
</html>
