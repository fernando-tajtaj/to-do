<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - QA Proyectos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>
<main class="pagina" data-nav="inicio">
    <div class="encabezado-pagina">
        <div>
            <h1>Inicio</h1>
            <p class="subtitulo" id="saludo">Resumen de tus proyectos</p>
        </div>
        <div class="acciones" id="accionesInicio"></div>
    </div>

    <!-- Indicadores generales -->
    <div class="row g-3 mb-3" id="indicadores"></div>

    <div class="row g-3 mb-3">
        <!-- Resumen por proyecto -->
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h2>Resumen por proyecto</h2>
                    <a href="/proyectos.html" class="small">Ver proyectos</a>
                </div>
                <div class="table-responsive" id="tablaProyectos"></div>
            </div>
        </div>

        <!-- Reportes con filtros -->
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header"><h2>Tareas por estado</h2></div>
                <div class="card-body">
                    <div class="d-flex flex-column gap-2 mb-3">
                        <select id="filtroAlcance" class="form-select form-select-sm" aria-label="Filtrar por proyecto o tablero"></select>
                        <select id="filtroResponsable" class="form-select form-select-sm" aria-label="Filtrar por responsable o rol"></select>
                    </div>
                    <div class="contenedor-grafica"><canvas id="graficaEstados" aria-label="Gráfica de tareas por estado" role="img"></canvas></div>
                    <div class="d-flex justify-content-between mt-3 small">
                        <span class="text-secondary-ui">Vencidas: <strong class="text-critical" id="reporteVencidas">0</strong></span>
                        <span class="text-secondary-ui">Bugs abiertos: <strong id="reporteBugs">0</strong></span>
                        <span class="text-secondary-ui">Total: <strong id="reporteTotal">0</strong></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header"><h2>Asignadas a mí</h2></div>
                <ul class="lista-ui" id="listaMias"></ul>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header"><h2>Tareas vencidas</h2></div>
                <ul class="lista-ui" id="listaVencidas"></ul>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header"><h2>Actividad reciente</h2></div>
                <ul class="lista-ui" id="listaActividad"></ul>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
